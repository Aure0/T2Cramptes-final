name: Deploy T2Cramptés to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site and export T2C GTFS & Service Alerts snapshot
        env:
          VITE_BASE_PATH: './'
          VITE_STATIC_MODE: 'true'
          VITE_GITHUB_REPO: ${{ github.repository }}
          # Optional: set VITE_API_BASE_URL or VITE_ALERTS_PROXY_URL in Repository Variables
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ALERTS_PROXY_URL: ${{ vars.VITE_ALERTS_PROXY_URL }}
          VITE_ANDROID_APK_URL: ${{ vars.VITE_ANDROID_APK_URL }}
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
